
name: Snowflake CI - Repository Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Snowflake Repository
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Inspect GitHub Actions runner
        run: |
          echo "Operating System:"
          uname -a

          echo "Current User:"
          whoami

          echo "Working Directory:"
          pwd

          echo "Available Disk Space:"
          df -h

          echo "Git Version:"
          git --version

          echo "Python Version:"
          python3 --version

      - name: Display runner information
        run: |
          echo "GitHub Actions runner started"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch or ref: $GITHUB_REF_NAME"

      - name: Validate Module 05 directory structure
        run: |
          test -d .github/workflows
          test -d 05-snowflake-github-actions/sql
          test -d 05-snowflake-github-actions/docs

          echo "Module 05 directory structure validated."

      - name: CI validation completed
        run: |
          echo "Snowflake repository validation successful!"

